# ============================================================================
#  自助付费打印系统 —— Nginx 站点配置
#  部署位置：/etc/nginx/conf.d/print.conf
#  依据：设计文档 第2章 §1.2 Nginx 关键配置要点
#
#  说明：本文件被 nginx.conf 的 http 块 include，故 limit_req_zone / map 等
#        http 上下文指令可直接写在本文件顶部。
# ============================================================================

# —— 限流区定义（http 上下文）——
# 通用 API：20r/s（单店并发 ≤200 足够，超限返回 429）
limit_req_zone  $binary_remote_addr zone=api_zone:10m    rate=20r/s;
# 验证码：1r/m（严格限频，防短信轰炸与成本失控）
limit_req_zone  $binary_remote_addr zone=sms_zone:10m    rate=1r/m;
# 上传：30r/m
limit_req_zone  $binary_remote_addr zone=upload_zone:10m rate=30r/m;
# 并发连接
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# WebSocket 连接升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端地址（仅监听 127.0.0.1，不对外暴露）
upstream print_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# —— HTTP 强制跳转 HTTPS ——
server {
    listen      80;
    listen      [::]:80;
    server_name print.example.com;

    # 健康检查放行（供负载均衡/监控探测）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# —— HTTPS 主站 ——
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                 # nginx ≥1.25 写法；旧版本可用 `listen 443 ssl http2;`
    server_name print.example.com;

    # —— TLS（支付场景合规底线：仅 1.2/1.3）——
    ssl_certificate     /etc/letsencrypt/live/print.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/print.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # —— 安全响应头 ——
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # —— 全局请求体 & 超时 ——
    client_max_body_size 50m;          # 与后端 multipart 上限一致（FILE_MAX_SIZE_MB=50）
    client_body_timeout  60s;

    # —— gzip ——
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml text/xml image/svg+xml;

    # 日志（含 traceId 便于全链路排查）
    access_log /var/log/nginx/print.access.log;
    error_log  /var/log/nginx/print.error.log warn;

    # —— 静态 SPA ——
    root  /var/www/print/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;      # SPA history 路由回退
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # —— 上传接口（放宽 body 与超时，边收边传）——
    location /api/v1/files {
        limit_req  zone=upload_zone burst=10 nodelay;
        limit_conn conn_zone 20;
        proxy_pass http://print_backend;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;           # 大文件边收边传，降低内存占用
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # —— 验证码接口（严格限频，防刷）——
    location = /api/v1/auth/sms/send {
        limit_req  zone=sms_zone burst=2 nodelay;
        proxy_pass http://print_backend;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # —— 通用 API 反代 ——
    location /api/ {
        limit_req  zone=api_zone burst=40 nodelay;
        limit_conn conn_zone 50;
        proxy_pass http://print_backend;
        proxy_read_timeout 65s;                # > 助手 claim 长轮询 25s，留足余量
        proxy_send_timeout 30s;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # —— WebSocket 升级（保留给未来实时推送）——
    location /ws/ {
        proxy_pass http://print_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;               # WS 长连接，勿用默认 60s
        proxy_send_timeout 300s;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # 隐藏文件拒绝
    location ~ /\.(?!well-known) {
        deny all;
    }
}
