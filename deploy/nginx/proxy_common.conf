# ============================================================================
#  自助付费打印系统 —— Nginx 反代公共片段
#  部署位置：/etc/nginx/conf.d/proxy_common.conf
#  被 print.conf 各 proxy location 以 include 复用（设计文档 第2章 §1.2）
# ============================================================================

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Trace-Id        $request_id;   # 生成 traceId 透传后端，贯穿全链路日志

proxy_http_version 1.1;
proxy_set_header Connection "";                   # 配合 upstream keepalive

proxy_buffering on;
proxy_connect_timeout 10s;
